name = "murrieta-ai"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Модель на OpenRouter. Основная — надёжная и хорошо пишет по-русски.
#   qwen/qwen3.7-flash            $0.030 / $0.130 за 1M токенов  ← по умолчанию
#   deepseek/deepseek-v4-flash-0731  $0.090 / $0.180
#   google/gemini-2.5-flash-lite     $0.100 / $0.400  (самый предсказуемый)
MODEL = "google/gemini-2.5-flash-lite"

# Максимум токенов в ответе — прямой рычаг на стоимость.
MAX_TOKENS = "1100"

# Резерв, если основная модель недоступна или упёрлась в rate-limit провайдера
FALLBACK_MODELS = "deepseek/deepseek-v4-flash-0731,mistralai/mistral-small-3.2-24b-instruct"

# Кто может обращаться к Worker. Укажите адрес своего сайта.
# Для локальной проверки добавьте http://localhost:8080
# Старый github.io-адрес оставлен: пока не переключился DNS, сайт открывается по нему.
ALLOWED_ORIGINS = "https://zakonka.online,https://www.zakonka.online,https://realfactchecknews-eng.github.io,http://localhost:8080"

# Показывается в статистике OpenRouter
SITE_URL = "https://zakonka.online/"
